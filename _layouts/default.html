<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<nav>
  <a href="#" class="nav-logo">
    <span class="nav-logo-mark"></span>
    Smooth Vector
  </a>
  <ul class="nav-links">
    <li><a href="#services">Services</a></li>
    <li><a href="#process">Process</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact" class="nav-cta">Book a consultation</a></li>
  </ul>
</nav>

{{ content }}

<footer>
  <a href="#" class="footer-brand">
    <span class="footer-brand-mark"></span>
    Smooth Vector Solutions
  </a>
  <div class="footer-meta">
    &copy; {{ 'now' | date: "%Y" }} Smooth Vector Solutions. All rights reserved.<br>
    Tech Shapers Ltd &middot; Company No. 15921823 &middot; Chelmsford CM1 1JG
  </div>
</footer>

<div id="tweaks-panel">
  <div class="tweaks-header">Tweaks</div>
  <div class="tweaks-body">
    <div class="tweak-row">
      <label>Theme</label>
      <select id="tweak-theme">
        <option value="dark">Dark (default)</option>
        <option value="light">Light</option>
        <option value="warm">Warm dark</option>
      </select>
    </div>
    <div class="tweak-row">
      <label>Accent colour</label>
      <select id="tweak-accent">
        <option value="teal">Electric teal</option>
        <option value="violet">Violet</option>
        <option value="amber">Amber</option>
        <option value="green">Green</option>
      </select>
    </div>
    <div class="tweak-row">
      <label>Type scale</label>
      <input type="range" id="tweak-scale" min="90" max="115" step="5" value="100">
    </div>
  </div>
</div>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
